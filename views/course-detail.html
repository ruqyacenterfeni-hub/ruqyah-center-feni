<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>কোর্স কারিকুলাম ও বিস্তারিত | রুকইয়াহ সাপোর্ট অ্যান্ড হিজামা সেন্টার</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
  <style>
    .module-accordion {
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      margin-bottom: 1rem;
      background: #FFF;
      overflow: hidden;
    }
    .module-header {
      background: #F8FAFC;
      padding: 1rem 1.25rem;
      font-weight: 600;
      color: #1E293B;
      border-bottom: 1px solid #E2E8F0;
      display: flex;
      justify-content: space-between;
    }
    .lesson-item {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid #F1F5F9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #334155;
      font-size: 0.95rem;
    }
    .lesson-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand-logo">
        <img src="/images/logo.png" alt="রুকইয়াহ সাপোর্ট সেন্টার" style="height: 52px; width: auto; object-fit: contain;">
      </a>
      <nav class="desktop-nav">
        <a href="/">হোম</a>
        <a href="/ruqyah">রুকইয়াহ লাইব্রেরি</a>
        <a href="/hijama">হিজামা গাইড</a>
        <a href="/shop">সুন্নাহ শপ</a>
        <a href="/lifestyle">আমল ট্র্যাকার</a>
        <a href="/courses" class="active">কোর্সসমূহ</a>
        <a href="/book" class="btn btn-primary" style="color: #FFF; padding: 0.5rem 1rem;">বুকিং করুন</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 3rem 0;" id="courseDetailMain">
    <div style="text-align: center; padding: 3rem;">লোড হচ্ছে...</div>
  </main>

  <footer class="site-footer" style="background: #0F172A; color: #CBD5E1; padding: 3rem 0; margin-top: 3rem;">
    <div class="container" style="text-align: center;">
      <p>© 2026 রুকইয়াহ সাপোর্ট অ্যান্ড হিজামা সেন্টার – ফেনী শাখা</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    async function loadDetail() {
      const slug = window.location.pathname.split('/').pop();
      try {
        const res = await fetch('/api/courses/' + slug);
        const data = await res.json();
        if (data.success && data.course) {
          const c = data.course;
          const curr = data.curriculum || [];

          document.getElementById('courseDetailMain').innerHTML = `
            <div style="margin-bottom: 2rem;">
              <a href="/courses" style="color: var(--primary); text-decoration: none; font-size: 0.95rem;">← সকল কোর্সে ফিরে যান</a>
              <h1 style="color: #0F172A; font-size: 2.2rem; margin-top: 0.75rem; margin-bottom: 0.5rem;">${c.title_bn}</h1>
              <p style="color: #64748B; font-size: 1.1rem; line-height: 1.6;">${c.description_bn || ''}</p>
              <div style="display: flex; gap: 1.5rem; margin-top: 1rem; align-items: center;">
                <span style="font-size: 1.35rem; font-weight: 700; color: #1E3A8A;">${c.fee === 0 ? 'ফ্রি কোর্স' : '৳' + c.fee}</span>
                <span style="background: #E0E7FF; color: #3730A3; padding: 4px 12px; border-radius: 9999px; font-size: 0.85rem;">সময়কাল: ${c.duration || '৪ সপ্তাহ'}</span>
              </div>
            </div>

            <div style="background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 1.5rem; margin-bottom: 2rem;">
              <h3 style="color: #0F172A; margin-bottom: 0.75rem;">🎯 কোর্সের উদ্দেশ্য ও প্রাপ্তি</h3>
              <p style="color: #334155; line-height: 1.6;">${c.objectives_bn || 'কুরআন ও সুন্নাহ মোতাবেক বিশুদ্ধ রুকইয়াহ শিক্ষা, বদনজর ও জাদুর আক্রমণ থেকে আত্মরক্ষা।'}</p>
            </div>

            <h2 style="color: #0F172A; font-size: 1.5rem; margin-bottom: 1.25rem;">📚 পূর্ণাঙ্গ সিলেবাস ও কারিকুলাম</h2>
            <div>
              ${curr.map((mod, idx) => `
                <div class="module-accordion">
                  <div class="module-header">
                    <span>মডিউল ${idx + 1}: ${mod.title_bn}</span>
                    <span style="font-size: 0.85rem; color: #64748B;">${mod.lessons ? mod.lessons.length : 0} পাঠ</span>
                  </div>
                  <div>
                    ${(mod.lessons || []).map(les => `
                      <div class="lesson-item">
                        <span>▶️ ${les.title_bn}</span>
                        <span style="font-size: 0.8rem; color: #64748B;">${les.duration || '১০ মিনিট'}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>

            <div style="text-align: center; margin-top: 3rem;">
              <a href="https://wa.me/8801758354920?text=${encodeURIComponent('আসসালামু আলাইকুম, আমি ' + c.title_bn + ' কোর্সে ভর্তি হতে আগ্রহী।')}" target="_blank" class="btn btn-primary" style="padding: 0.85rem 2rem; font-size: 1.1rem; text-decoration: none;">
                হোয়াটসঅ্যাপে কোর্সে ভর্তি হন
              </a>
            </div>
          `;
        }
      } catch (e) {
        console.error(e);
      }
    }

    document.addEventListener('DOMContentLoaded', loadDetail);
  </script>
</body>
</html>
